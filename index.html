<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F4F6FC" />
<title>Mystic Multimarca — Control de Horas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F6FC; --surface: #FFFFFF; --ink: #1E1B3A; --ink-soft: #6A7096; --line: #E8EBF5;
  --blue: #3D6DF0; --blue-2: #5A86FF; --purple: #6459F0; --purple-2: #7C6CF5; --cyan: #3FB1E6; --cyan-2: #5CC4F0;
  --coral: #EE8782; --coral-2: #F3A09B; --orange: #EF8E67; --green: #2FAE82; --amber: #E0A340; --danger: #E5534B;
  --tint-blue: #E8EEFF; --tint-purple: #ECEAFF; --tint-cyan: #E1F4FC; --tint-coral: #FDE9E7; --tint-green: #DFF4EC; --tint-amber: #FFF1D6;
  --shadow-1: 0 1px 2px rgba(30,27,58,.04), 0 10px 30px rgba(61,85,170,.08);
  --shadow-2: 0 4px 10px rgba(30,27,58,.08), 0 24px 60px rgba(30,27,58,.22);
  --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  --spring: cubic-bezier(0.34, 1.35, 0.64, 1);     /* resorte con ligero rebote */
  --smooth: cubic-bezier(0.22, 1, 0.36, 1);        /* resorte amortiguado */
  --font: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.45; background: var(--bg); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
::selection { background: var(--tint-blue); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
:focus-visible { outline: 3px solid rgba(61,109,240,.45); outline-offset: 2px; border-radius: 10px; }

/* ---------- Estructura ---------- */
.shell { min-height: 100vh; display: block; }
body.is-admin .shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); }
.side { display: none; position: sticky; top: 0; height: 100vh; flex-direction: column; gap: 6px; padding: 24px 16px 20px; background: var(--surface); border-right: 1px solid var(--line); }
body.is-admin .side { display: flex; }
.side-brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 22px; }
.side-brand img { height: 46px; width: auto; }
.side-brand b { font-size: 17px; letter-spacing: -0.02em; display: block; line-height: 1.1; }
.side-brand span { font-size: 11px; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.nav { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border: 0; border-radius: 14px; background: none; color: var(--ink-soft); font-weight: 600; font-size: 14.5px; text-align: left;
  transition: background .25s, color .25s, transform .45s var(--spring), box-shadow .25s; }
.nav:hover { background: var(--bg); color: var(--ink); }
.nav:active { transform: scale(.96); transition-duration: .05s; }
.nav[aria-selected="true"] { background: linear-gradient(135deg, var(--blue-2), var(--blue)); color: #fff; box-shadow: 0 10px 22px rgba(61,109,240,.34); }
.side-sep { height: 1px; background: var(--line); margin: 10px 10px; }
.side-foot { margin-top: auto; }
.main { min-width: 0; }

/* ---------- Barra superior ---------- */
.bar { position: sticky; top: 0; z-index: 40; background: rgba(244,246,252,.78); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(232,235,245,.9); }
.bar-in { max-width: 1240px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.brand-logo { height: 46px; width: auto; flex-shrink: 0; }
.brand-eyebrow { margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
.brand-title { margin: 1px 0 0; font-weight: 800; font-size: 19px; letter-spacing: -0.025em; white-space: nowrap; }
.crumb { display: none; flex: 1; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 14px; font-weight: 500; }
.crumb b { color: var(--ink); font-weight: 700; }
body.is-admin .brand { display: none; } body.is-admin .crumb { display: flex; }
.clock { text-align: right; line-height: 1.15; }
.clock b { display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.025em; }
.clock span { display: block; font-size: 11.5px; color: var(--ink-soft); }
.clock span::first-letter { text-transform: uppercase; }

/* ---------- Control segmentado ---------- */
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #E6EAF6; border-radius: 13px; padding: 3px; }
.seg-thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 10px; background: #fff; box-shadow: 0 1px 3px rgba(30,27,58,.14), 0 4px 10px rgba(61,85,170,.10); transition: transform .45s var(--spring), width .45s var(--spring); }
.seg button { position: relative; z-index: 1; background: none; border: 0; padding: 8px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; transition: color .2s, transform .2s var(--smooth); }
.seg button[aria-selected="true"] { color: var(--blue); }
.seg button:active { transform: scale(.95); transition-duration: .05s; }

/* ---------- Contenedor ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 28px 96px; }
.view { animation: rise .5s var(--smooth) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
h2.title { font-size: 30px; line-height: 1.1; letter-spacing: -0.035em; font-weight: 800; margin: 4px 0 6px; }
.lede { margin: 0 0 22px; color: var(--ink-soft); font-size: 15px; max-width: 62ch; }
.section { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 32px 0 12px; }
.section h3 { margin: 0; font-size: 18px; letter-spacing: -0.025em; font-weight: 800; }
.section small { color: var(--ink-soft); font-size: 12.5px; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }

/* ---------- Botones ---------- */
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; font-size: 14px; min-height: 44px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .5s var(--spring), opacity .15s, box-shadow .2s, background .2s; }
.btn:hover { opacity: .93; }
.btn:active { transform: scale(.955); transition: transform .06s ease-out; }
.btn-in { background: linear-gradient(135deg, var(--purple-2), var(--purple)); color: #fff; box-shadow: 0 10px 22px rgba(100,89,240,.32); }
.btn-lunch { background: linear-gradient(135deg, var(--cyan-2), var(--cyan)); color: #fff; box-shadow: 0 10px 22px rgba(63,177,230,.34); }
.btn-out { background: linear-gradient(135deg, var(--coral-2), var(--coral)); color: #fff; box-shadow: 0 10px 22px rgba(238,135,130,.34); }
.btn-primary { background: linear-gradient(135deg, var(--blue-2), var(--blue)); color: #fff; box-shadow: 0 10px 22px rgba(61,109,240,.32); }
.btn-soft { background: var(--tint-blue); color: var(--blue); }
.btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn-sm { width: auto; min-height: 38px; padding: 8px 15px; font-size: 13px; border-radius: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--ink-soft); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.icon-btn { background: none; border: 0; width: 34px; height: 34px; border-radius: 10px; color: var(--ink-soft); font-size: 15px; transition: transform .4s var(--spring), background .2s, color .2s; }
.icon-btn:hover { background: var(--bg); color: var(--blue); }
.icon-btn:active { transform: scale(.88); transition-duration: .05s; }
.icon-btn.danger:hover { color: var(--danger); }

/* ---------- Tarjetas del equipo ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-1); transition: box-shadow .3s, border-color .3s, transform .5s var(--spring); }
.card.active { border-color: #C9D6FF; box-shadow: 0 14px 34px rgba(61,109,240,.20); }
.card.on-lunch { border-color: #BFE6F7; box-shadow: 0 14px 34px rgba(63,177,230,.22); }
.card-top { display: flex; align-items: center; gap: 12px; }
.avatar-ring { position: relative; width: 54px; height: 54px; flex-shrink: 0; display: grid; place-items: center; }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; z-index: 2; color: #fff; font-weight: 800; font-size: 15px; letter-spacing: .02em; background: linear-gradient(145deg, var(--purple-2), var(--blue)); box-shadow: 0 6px 14px rgba(100,89,240,.32); }
.avatar.lunch { background: linear-gradient(145deg, var(--cyan-2), var(--cyan)); box-shadow: 0 6px 14px rgba(63,177,230,.34); }
.pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--blue); animation: bloom 2.4s ease-out infinite; }
.pulse.gold { border-color: var(--cyan); }
@keyframes bloom { 0% { transform: scale(.82); opacity: .9; } 70% { transform: scale(1.28); opacity: 0; } 100% { opacity: 0; } }
.name { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
.status { font-size: 12.5px; color: var(--ink-soft); }
.status.live { color: var(--green); font-weight: 700; }
.status.lunch { color: #1F8DBE; font-weight: 700; }
.note { font-size: 12px; color: var(--ink-soft); padding-top: 10px; border-top: 1px dashed var(--line); }
.note.info { color: #1F8DBE; }

/* ---------- Tabs (móvil) y periodo ---------- */
.tabs-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.tabs-row .seg { max-width: 100%; overflow-x: auto; }
#sub { display: none; }
.period { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.period-label { min-width: 230px; text-align: center; padding: 4px 12px; }
.period-label b { display: block; font-size: 17px; letter-spacing: -0.025em; font-weight: 800; }
.period-label span { font-size: 12.5px; color: var(--ink-soft); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; vertical-align: 2px; }
.badge.live { background: var(--tint-green); color: #1B8A64; } .badge.closed { background: #E6EAF6; color: var(--ink-soft); }
.nav-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 18px; transition: transform .45s var(--spring), background .2s; }
.nav-btn:hover { background: var(--bg); } .nav-btn:active { transform: scale(.88); transition-duration: .05s; }

/* ---------- KPIs de color ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin: 14px 0 20px; }
.kpi { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px 20px 18px; color: #fff; min-height: 150px; display: flex; flex-direction: column; }
.kpi::before, .kpi::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.13); pointer-events: none; }
.kpi::before { width: 150px; height: 150px; right: -40px; top: -50px; } .kpi::after { width: 96px; height: 96px; right: 44px; bottom: -56px; background: rgba(255,255,255,.09); }
.kpi.purple { background: linear-gradient(145deg, var(--purple-2), var(--purple)); box-shadow: 0 16px 34px rgba(100,89,240,.30); }
.kpi.cyan { background: linear-gradient(145deg, var(--cyan-2), var(--cyan)); box-shadow: 0 16px 34px rgba(63,177,230,.30); }
.kpi.blue { background: linear-gradient(145deg, var(--blue-2), var(--blue)); box-shadow: 0 16px 34px rgba(61,109,240,.30); }
.kpi.coral { background: linear-gradient(145deg, var(--coral-2), var(--coral)); box-shadow: 0 16px 34px rgba(238,135,130,.32); }
.kpi-t { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; position: relative; }
.kpi-s { font-size: 12.5px; opacity: .85; position: relative; }
.kpi-row { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; position: relative; padding-top: 14px; }
.kpi-v { font-size: 25px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; }
.kpi-i { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 6px 14px rgba(0,0,0,.10); }
.kpi.purple .kpi-i { color: var(--purple); } .kpi.cyan .kpi-i { color: var(--cyan); } .kpi.blue .kpi-i { color: var(--blue); } .kpi.coral .kpi-i { color: var(--coral); }
.kpi-i svg.i { width: 19px; height: 19px; stroke-width: 2.2; }

/* ---------- Gráfica y resumen ---------- */
.duo { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(280px, 1fr); gap: 18px; align-items: stretch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; flex-wrap: wrap; }
.panel-h h3 { margin: 0; font-size: 17px; letter-spacing: -0.025em; font-weight: 800; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.chart { position: relative; padding: 0 12px 14px 8px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid-l { stroke: var(--line); stroke-dasharray: 3 5; } .chart .ax { fill: var(--ink-soft); font-size: 11px; font-weight: 500; }
.chart .guide { stroke: #C9D1EA; stroke-width: 1.5; opacity: 0; transition: opacity .15s; } .chart.on .guide { opacity: 1; }
.chart .dot-p { opacity: 0; transition: opacity .15s; } .chart.on .dot-p { opacity: 1; }
.chart .line { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.tip { position: absolute; top: 4px; transform: translateX(-50%); background: var(--blue); color: #fff; padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .15s; white-space: nowrap; box-shadow: 0 10px 24px rgba(61,109,240,.35); z-index: 3; line-height: 1.5; }
.chart.on .tip { opacity: 1; } .tip small { display: block; font-size: 10.5px; opacity: .8; font-weight: 600; }
.ov { padding: 0 20px 22px; }
.ov-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.ov-stat { background: var(--bg); border-radius: 18px; padding: 18px 12px; text-align: center; }
.ov-stat b { display: block; font-size: 32px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; } .ov-stat span { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.bar-row { margin-top: 16px; } .bar-row .top { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700; margin-bottom: 7px; } .bar-row .top span:last-child { color: var(--ink); }
.track { height: 7px; background: #EEF1F9; border-radius: 99px; overflow: hidden; } .track i { display: block; height: 100%; border-radius: 99px; transition: width .7s var(--smooth); }

/* ---------- Alertas ---------- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); transition: transform .4s var(--spring), background .2s, color .2s; }
.chip:active { transform: scale(.93); transition-duration: .05s; } .chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.alert { display: flex; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); font-size: 13.5px; align-items: flex-start; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.dot.error { background: var(--danger); } .dot.warn { background: var(--amber); } .dot.info { background: var(--cyan); }
.alert b { font-weight: 700; } .alert .when { color: var(--ink-soft); font-size: 12px; margin-left: 6px; }
.empty { padding: 22px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }

/* ---------- Tablas ---------- */
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; padding: 13px 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); background: #F8F9FD; white-space: nowrap; }
td { padding: 12px; border-top: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th.num, td.num { text-align: right; }
.emp-row { cursor: pointer; transition: background .2s; } .emp-row:hover { background: #F6F8FF; }
.emp-row .chev { display: inline-block; color: var(--ink-soft); transition: transform .45s var(--spring); margin-right: 6px; } .emp-row.open .chev { transform: rotate(90deg); color: var(--blue); }
.emp-row.open { background: #F6F8FF; } .emp-row td:first-child { font-weight: 700; }
tfoot td { font-weight: 800; background: #F8F9FD; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.pill.gold { background: var(--tint-amber); color: #9A6A12; } .pill.rose { background: var(--tint-purple); color: var(--purple); }
.pill.warn { background: var(--tint-coral); color: #C7453F; } .pill.ok { background: var(--tint-green); color: #1B8A64; }
.muted { color: var(--ink-soft); } .strong { font-weight: 800; }
tr.row-gold td { background: #FFF8E8; } tr.row-warn td { background: #FEF0EE; }
.detail-box { padding: 20px 22px 24px; background: #F8F9FE; display: grid; gap: 20px; }
.detail-box h4 { margin: 0 0 8px; font-size: 13px; font-weight: 800; color: var(--blue); letter-spacing: .01em; }
.detail-box .table-wrap { box-shadow: none; border-radius: var(--r-md); }
.pay-lines { display: grid; max-width: 520px; }
.pay-line { display: flex; justify-content: space-between; gap: 18px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.pay-line small { display: block; color: var(--ink-soft); font-size: 11.5px; }
.pay-line.total { border-bottom: 0; font-weight: 800; font-size: 16px; color: var(--blue); padding-top: 12px; } .pay-line.minus b { color: var(--danger); }

/* ---------- Formularios ---------- */
.field { display: grid; gap: 6px; } .field > span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea { width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: 13px; background: #fff; min-height: 44px; transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(61,109,240,.18); }
.inline-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 18px 20px; align-items: end; }
.money-input { text-align: right; max-width: 190px; font-weight: 700; }
.row-actions { display: flex; gap: 2px; justify-content: flex-end; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; } .filters select, .filters input { width: auto; min-width: 150px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; } .setting:first-child { border-top: 0; }
.setting small { display: block; color: var(--ink-soft); font-size: 12px; max-width: 54ch; } .setting input, .setting select { width: 150px; text-align: center; }
details.legal { margin-top: 28px; background: var(--tint-blue); border-radius: var(--r-lg); }
details.legal summary { padding: 17px 22px; cursor: pointer; font-weight: 800; color: var(--blue); list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.legal summary::after { content: '＋'; transition: transform .4s var(--spring); } details.legal[open] summary::after { transform: rotate(45deg); } details.legal summary::-webkit-details-marker { display: none; }
.legal-body { padding: 0 22px 22px; font-size: 13.5px; color: var(--ink-soft); } .legal-body table { background: #fff; border-radius: var(--r-md); overflow: hidden; margin: 10px 0 14px; } .legal-body li { margin: 4px 0; } .legal-body b { color: var(--ink); }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(30,27,58,.36); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); opacity: 0; transition: opacity .25s; }
.overlay.show { opacity: 1; }
.sheet { width: 100%; max-width: 420px; max-height: calc(100dvh - 40px); overflow: auto; background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 26px; padding: 26px; box-shadow: var(--shadow-2); transform: scale(.9) translateY(14px); opacity: 0; transition: transform .55s var(--spring), opacity .2s; }
.overlay.show .sheet { transform: none; opacity: 1; }
.sheet h3 { margin: 0 0 8px; font-size: 21px; font-weight: 800; letter-spacing: -0.03em; } .sheet p { margin: 0 0 16px; color: var(--ink-soft); font-size: 14px; }
.sheet .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; } .sheet .full { grid-column: 1 / -1; }
.actions { display: flex; gap: 10px; margin-top: 6px; } .pin { text-align: center; letter-spacing: .3em; font-size: 20px; font-weight: 700; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; } .check input { width: 20px; height: 20px; min-height: 0; accent-color: var(--blue); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px) scale(.96); background: rgba(30,27,58,.94); color: #fff; padding: 12px 20px; border-radius: 99px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-2); opacity: 0; pointer-events: none; z-index: 200; transition: transform .5s var(--spring), opacity .25s; }
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.loading { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
.foot { text-align: center; margin-top: 36px; font-size: 12.5px; color: var(--ink-soft); }

/* ---------- Adaptación ---------- */
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .duo { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  body.is-admin .shell { display: block; } body.is-admin .side { display: none; }
  body.is-admin .brand { display: flex; } body.is-admin .crumb { display: none; }
  #sub:not([hidden]) { display: flex; }
}
@media (max-width: 720px) {
  .bar-in { padding: 10px 14px; gap: 10px; flex-wrap: wrap; } .brand-title { font-size: 17px; } .clock b { font-size: 16px; } .clock span { display: none; }
  .bar .seg { order: 3; width: 100%; } .bar .seg button { padding: 9px 10px; }
  .wrap { padding: 18px 14px 90px; } h2.title { font-size: 26px; }
  .period-label { min-width: 0; flex: 1; } .kpis { gap: 10px; } .kpi { padding: 16px; min-height: 132px; } .kpi.purple { grid-column: 1 / -1; } .kpi-v { font-size: 22px; }
  .sheet .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .12s !important; }
  .pulse { animation: none; opacity: .4; } .btn:active, .nav-btn:active, .chip:active, .icon-btn:active, .seg button:active, .nav:active { transform: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .bar, .sheet, .overlay { -webkit-backdrop-filter: none; backdrop-filter: none; } .bar { background: var(--bg); } .sheet { background: #fff; } .overlay { background: rgba(30,27,58,.62); }
}
@media (prefers-contrast: more) { :root { --line: #aeb4d0; --ink-soft: #444a6e; } .panel, .table-wrap, .card { border-color: #7f86ab; } }
@media print { .bar, .side, .seg, .btn, .toast { display: none !important; } body.is-admin .shell { display: block; } }

.btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; transform: none; }
.note.warn { color: #B4701A; }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: var(--ink-soft); vertical-align: 1px; }
.dot.ok { background: var(--green); } .dot.err { background: var(--danger); } .dot.wait { background: var(--amber); }
code { background: var(--tint-blue); padding: 1px 6px; border-radius: 6px; font-size: .92em; }

</style>

<script>
/* ============================================================
   MOTOR DE CÁLCULO — Mystic Multimarca
   Horas extra, recargos y pago quincenal (Colombia).
   Todo se calcula en hora de Colombia (UTC-5, sin horario de verano),
   sin importar la zona horaria del dispositivo.
   ============================================================ */
const MysticEngine = (function () {
  'use strict';

  const MS_H = 3600000;
  const MS_D = 86400000;
  const COL = -5 * MS_H;               // Colombia = UTC-5
  const pad = (n) => String(n).padStart(2, '0');

  /* ---------- Fechas (cadenas YYYY-MM-DD) ---------- */
  function utcOf(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
  function dsOfUtc(t) { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  function addDays(s, n) { return dsOfUtc(utcOf(s) + n * MS_D); }
  function dowOf(s) { return new Date(utcOf(s)).getUTCDay(); }              // 0 = domingo
  function mondayOf(s) { const w = dowOf(s); return addDays(s, -(w === 0 ? 6 : w - 1)); }
  function colDs(ms) { return dsOfUtc(ms + COL); }                           // fecha en Colombia
  function colMidnight(s) { return utcOf(s) - COL; }                         // ms de las 00:00 en Colombia
  function colHour(ms) { const d = new Date(ms + COL); return d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600; }
  function daysBetween(a, b) { return Math.round((utcOf(b) - utcOf(a)) / MS_D); }
  function lastDayOfMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  /* ---------- Quincenas ---------- */
  function periodOf(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const half = d <= 15 ? 1 : 2;
    return periodFor(y, m, half);
  }
  function periodFor(y, m, half) {
    const last = lastDayOfMonth(y, m);
    return {
      year: y, month: m, half,
      from: `${y}-${pad(m)}-${half === 1 ? '01' : '16'}`,
      to: `${y}-${pad(m)}-${pad(half === 1 ? 15 : last)}`
    };
  }
  function shiftPeriod(p, delta) {
    let idx = p.year * 24 + (p.month - 1) * 2 + (p.half - 1) + delta;
    const y = Math.floor(idx / 24); idx -= y * 24;
    return periodFor(y, Math.floor(idx / 2) + 1, (idx % 2) + 1);
  }

  /* ---------- Festivos de Colombia (Ley Emiliani) ---------- */
  function easterUtc(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
      m = Math.floor((a + 11 * h + 22 * l) / 451),
      month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return Date.UTC(y, month - 1, day);
  }
  function toMonday(t) { const w = new Date(t).getUTCDay(); return t + ((8 - w) % 7) * MS_D; }
  const _holCache = {};
  function holidaysOf(y) {
    if (_holCache[y]) return _holCache[y];
    const H = {};
    const put = (t, name) => { H[dsOfUtc(t)] = name; };
    const fixed = (m, d, name) => put(Date.UTC(y, m - 1, d), name);
    const moved = (m, d, name) => put(toMonday(Date.UTC(y, m - 1, d)), name);
    fixed(1, 1, 'Año Nuevo'); moved(1, 6, 'Reyes Magos'); moved(3, 19, 'San José');
    const E = easterUtc(y);
    put(E - 3 * MS_D, 'Jueves Santo'); put(E - 2 * MS_D, 'Viernes Santo');
    put(toMonday(E + 39 * MS_D), 'Ascensión del Señor');
    put(toMonday(E + 60 * MS_D), 'Corpus Christi');
    put(toMonday(E + 68 * MS_D), 'Sagrado Corazón');
    fixed(5, 1, 'Día del Trabajo'); moved(6, 29, 'San Pedro y San Pablo'); fixed(7, 20, 'Independencia');
    fixed(8, 7, 'Batalla de Boyacá'); moved(8, 15, 'Asunción de la Virgen'); moved(10, 12, 'Día de la Raza');
    moved(11, 1, 'Todos los Santos'); moved(11, 11, 'Independencia de Cartagena');
    fixed(12, 8, 'Inmaculada Concepción'); fixed(12, 25, 'Navidad');
    return (_holCache[y] = H);
  }
  function holidayName(s) { return holidaysOf(+s.slice(0, 4))[s] || null; }
  function isHoliday(s) { return dowOf(s) === 0 || !!holidayName(s); }       // domingo o festivo

  /* ---------- Reglas laborales que dependen de la fecha ---------- */
  // Recargo dominical/festivo (Ley 2466/2025): 80 % desde 1-jul-2025, 90 % desde 1-jul-2026, 100 % desde 1-jul-2027
  function sundayPct(s) { return s >= '2027-07-01' ? 1.0 : s >= '2026-07-01' ? 0.9 : s >= '2025-07-01' ? 0.8 : 0.75; }
  // Jornada nocturna: desde las 7:00 p. m. desde el 25-dic-2025 (antes, 9:00 p. m.) hasta las 6:00 a. m.
  function nightStartHour(s) { return s >= '2025-12-25' ? 19 : 21; }
  const NIGHT_PCT = 0.35, EXTRA_DAY_PCT = 0.25, EXTRA_NIGHT_PCT = 0.75;
  const LEGAL = { extraDailyMax: 2, extraWeeklyMax: 12, dailyOrdinaryMax: 8 };

  /* ---------- Intervalos de trabajo y segmentos ---------- */
  function workIntervals(r) {
    const a = Date.parse(r.checkIn), b = Date.parse(r.checkOut);
    if (!(b > a)) return [];
    if (r.lunchOut && r.lunchIn) {
      const lo = Date.parse(r.lunchOut), li = Date.parse(r.lunchIn);
      if (li > lo && lo >= a && li <= b) return [[a, lo], [li, b]];
    }
    return [[a, b]];
  }
  // Almuerzo obligatorio: entre lunchMin y lunchMax minutos en jornadas de más de reqH horas.
  // (La antigua marca "no tomó almuerzo" ya no exime: se ignora lunchSkipped.)
  const LUNCH_DEFAULT = { min: 30, max: 60, reqH: 6 }, LUNCH_TOL = 2;
  function lunchMinutes(r) { return (Date.parse(r.lunchIn) - Date.parse(r.lunchOut)) / 60000; }
  function lunchIssue(r, L) {
    L = Object.assign({}, LUNCH_DEFAULT, L || {});
    const a = Date.parse(r.checkIn), b = Date.parse(r.checkOut);
    if (r.lunchOut && r.lunchIn) {
      const lo = Date.parse(r.lunchOut), li = Date.parse(r.lunchIn);
      if (!(li > lo) || lo < a || li > b) return 'inconsistente';
      const m = (li - lo) / 60000;
      if (m < L.min - LUNCH_TOL) return 'corto';      // tolerancia de 2 min (segundos de marcación)
      if (m > L.max + LUNCH_TOL) return 'largo';
      return null;
    }
    if (r.lunchOut && !r.lunchIn) return 'sin-regreso';
    return (b - a) / MS_H > L.reqH ? 'sin-almuerzo' : null;
  }
  // Parte un intervalo en tramos con (fecha, nocturno?)
  function splitInterval(a, b) {
    const out = [];
    let cur = a;
    while (cur < b) {
      const day = colDs(cur), mid = colMidnight(day), ns = nightStartHour(day);
      const cands = [mid + 6 * MS_H, mid + ns * MS_H, mid + 24 * MS_H].filter((t) => t > cur);
      const end = Math.min(b, Math.min.apply(null, cands));
      const h = (cur - mid) / MS_H;
      out.push({ start: cur, end, date: day, night: h < 6 || h >= ns });
      cur = end;
    }
    return out;
  }

  /* ---------- Duplicados y solapados ---------- */
  function analyzeOverlaps(recs) {
    const sorted = recs.filter((r) => r.checkOut).slice().sort((x, y) => Date.parse(x.checkIn) - Date.parse(y.checkIn));
    const dup = new Set(), overlap = [];
    for (let i = 0; i < sorted.length; i++) {
      if (dup.has(sorted[i].id)) continue;
      for (let j = i + 1; j < sorted.length; j++) {
        const A = sorted[i], B = sorted[j];
        if (Date.parse(B.checkIn) >= Date.parse(A.checkOut)) break;
        const same = Math.abs(Date.parse(A.checkIn) - Date.parse(B.checkIn)) <= 120000 &&
                     Math.abs(Date.parse(A.checkOut) - Date.parse(B.checkOut)) <= 120000;
        if (same) dup.add(B.id); else overlap.push([A, B]);
      }
    }
    return { dup, overlap };
  }

  /* ---------- Cálculo principal ---------- */
  const R = (x) => Math.round(x);

  function computePeriod(cfg) {
    const {
      records = [], employees = [], salaries = {}, absences = [], from, to,
      weeklyHours = 42, crossing = 'fromStart', today = colDs(Date.now()), lunchMin = 30, lunchMax = 60, lunchRequiredHours = 6
    } = cfg;
    const L = { min: lunchMin, max: lunchMax, reqH: lunchRequiredHours };
    const divisor = weeklyHours * 5;                       // 42 h → 210 ; 44 h → 220
    const weeklyMs = weeklyHours * MS_H;
    const rangeStart = crossing === 'fullWeek' ? mondayOf(from) : from;
    const alerts = [];
    const addAlert = (level, name, date, text, kind) => alerts.push({ level, name, date: date || null, text, kind: kind || '' });

    const result = {
      period: { from, to, days: daysBetween(from, to) + 1 }, weeklyHours, divisor, crossing,
      employees: [], alerts, totals: null
    };

    employees.forEach((name) => {
      const salary = Number(salaries[name]) || 0;
      const vh = salary > 0 ? salary / divisor : 0;
      const myAll = records.filter((r) => r.name === name);
      const myClosed = myAll.filter((r) => r.checkOut && !r.excluded);
      const { dup, overlap } = analyzeOverlaps(myClosed);
      const myRecs = myClosed.filter((r) => !dup.has(r.id));

      // Alertas por registro
      myAll.forEach((r) => {
        if (r.date < rangeStart || r.date > to) return;
        if (r.excluded) { addAlert('info', name, r.date, 'Registro excluido del cálculo' + (r.note ? ': ' + r.note : '.'), 'excluido'); return; }
        if (!r.checkOut) {
          if (r.date < today) addAlert('error', name, r.date, 'Registro sin hora de salida: no se puede calcular. Corrígelo o exclúyelo.', 'abierto');
          return;
        }
        if (dup.has(r.id)) { addAlert('info', name, r.date, 'Registro duplicado excluido automáticamente (mismas horas que otro registro).', 'duplicado'); return; }
        const a = Date.parse(r.checkIn), b = Date.parse(r.checkOut);
        if (!(b > a)) { addAlert('error', name, r.date, 'La salida es anterior o igual a la entrada: no se cuenta.', 'incoherente'); return; }
        const li = lunchIssue(r, L);
        if (li === 'inconsistente') addAlert('warn', name, r.date, 'Almuerzo con horas incoherentes (fuera de la jornada o al revés): no se descontó.', 'incoherente');
        else if (li === 'sin-regreso') addAlert('warn', name, r.date, 'Salió a almuerzo pero no marcó el regreso: no se descontó.', 'incoherente');
        else if (li === 'sin-almuerzo') addAlert('warn', name, r.date, `Sin almuerzo registrado: es obligatorio (entre ${L.min} y ${L.max} min). No se descontó.`, 'sin-almuerzo');
        else if (li === 'corto') addAlert('warn', name, r.date, `Almuerzo de ${Math.round(lunchMinutes(r))} min: menos del mínimo de ${L.min} min. Se descontó lo registrado.`, 'almuerzo');
        else if (li === 'largo') addAlert('warn', name, r.date, `Almuerzo de ${Math.round(lunchMinutes(r))} min: supera el máximo de ${L.max} min. Se descontó completo.`, 'almuerzo');
        const span = (b - a) / MS_H;

        take(w.pieces.filter((p) => !p.night));

          workedMs: inP.reduce((s, p) => s + p.ms, 0), creditMs: w.creditMs,
          weekWorkedMs: workedMs, extraMs: inP.reduce((s, p) => s + p.extraMs, 0),
          extraNightMs: inP.filter((p) => p.night).reduce((s, p) => s + p.extraMs, 0),
          extraDayMs: inP.filter((p) => !p.night).reduce((s, p) => s + p.extraMs, 0),
          ordNightMs: inP.filter((p) => p.night).reduce((s, p) => s + (p.ms - p.extraMs), 0),
          partial: key < from || addDays(key, 6) > to

        if (extraMs / MS_H > LEGAL.extraWeeklyMax + 1e-9)
          addAlert('warn', name, key, `Extras de la semana del ${fmtDateEs(key)} al ${fmtDateEs(addDays(key, 6))}: ${fmtHM(extraMs)}; supera el tope legal de ${LEGAL.extraWeeklyMax} h semanales.`, 'tope');

      // Totales y pago por tramo
      const T = { ordDay: 0, ordNight: 0, ordHolDay: 0, ordHolNight: 0, extDay: 0, extNight: 0, extHolDay: 0, extHolNight: 0 };
      const pay = { ordNight: 0, ordHoliday: 0, extDay: 0, extNight: 0, extHoliday: 0 };
      const dayMap = {};
      const dayOf = (d) => (dayMap[d] = dayMap[d] || { date: d, workedMs: 0, extraDayMs: 0, extraNightMs: 0, ordNightMs: 0, holiday: isHoliday(d), holidayName: holidayName(d), dow: dowOf(d), records: [], notes: [] });

        const dm = dayOf(x.date); dm.absence = x; dm.notes.push(`ausencia (${x.hours} h acreditadas al conteo semanal)` + (x.note ? ' — ' + x.note : ''));

        if (dm.holiday && dm.workedMs > 0) dm.notes.push(dm.holidayName ? 'festivo: ' + dm.holidayName : 'domingo');
        if (dm.workedMs / MS_H > LEGAL.dailyOrdinaryMax + LEGAL.extraDailyMax + 1e-9)
          addAlert('warn', name, dm.date, `Día de ${fmtHM(dm.workedMs)}: supera 8 h ordinarias + 2 h extra por día.`, 'tope');
      });

      const absDays = myAbs.filter((x) => x.date >= from && x.date <= to).length;
      const base = salary / 2;
      const deduction = (salary / 30) * absDays;
      const surcharges = pay.ordNight + pay.ordHoliday + pay.extDay + pay.extNight + pay.extHoliday;
      const rounded = {
        base: R(base), deduction: R(deduction), ordNight: R(pay.ordNight), ordHoliday: R(pay.ordHoliday),
        extDay: R(pay.extDay), extNight: R(pay.extNight), extHoliday: R(pay.extHoliday)

      if (!hasRecs) addAlert('info', name, null, 'Sin registros en el periodo.', 'sin-registros');

      const sum = (k) => k.reduce((s, x) => s + T[x], 0);

        hours: {
          workedMs: pieces.filter((p) => p.date >= from && p.date <= to).reduce((s, p) => s + p.ms, 0),
          extraDayMs: T.extDay + T.extHolDay, extraNightMs: T.extNight + T.extHolNight,
          ordNightMs: T.ordNight + T.ordHolNight, holidayMs: sum(['ordHolDay', 'ordHolNight', 'extHolDay', 'extHolNight']),
          extraMs: sum(['extDay', 'extNight', 'extHolDay', 'extHolNight'])

        days: Object.values(dayMap).sort((a, b) => (a.date < b.date ? -1 : 1))

    const tot = { workedMs: 0, extraMs: 0, extraDayMs: 0, extraNightMs: 0, ordNightMs: 0, holidayMs: 0, extrasPay: 0, total: 0, base: 0, deduction: 0 };
    result.employees.forEach((e) => {
      tot.workedMs += e.hours.workedMs; tot.extraMs += e.hours.extraMs; tot.extraDayMs += e.hours.extraDayMs;
      tot.extraNightMs += e.hours.extraNightMs; tot.ordNightMs += e.hours.ordNightMs; tot.holidayMs += e.hours.holidayMs;
      tot.extrasPay += e.pay.extrasTotal; tot.total += e.pay.total; tot.base += e.pay.base; tot.deduction += e.pay.deduction;

<script>
/* ============================================================
   Sincronización opcional con Google Sheets (vía Google Apps Script)
   - La plataforma sigue funcionando igual si no se configura o si falla la red.
   - Solo se envían registros de horas y parámetros de almuerzo/jornada.
     NUNCA salarios, ausencias ni el PIN.
   - Lo que viene de la hoja solo AGREGA registros que no existan aquí (no pisa ni borra).
   ============================================================ */
const Sync = (() => {
  const st = { state: "off", last: null, msg: "" };
  let timer = null, busy = false, again = false, failStreak = 0;
  const URL_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
  const cfg = () => ({ url: String(settings.sheetUrl || "").trim(), token: String(settings.sheetToken || "").trim(), auto: settings.sheetAuto !== false });
  const enabled = () => { const c = cfg(); return URL_RE.test(c.url) && c.token.length >= 8; };
  const p2 = (n) => String(n).padStart(2, "0");
  const hms = (iso) => { const d = new Date(Date.parse(iso) + E.COL); return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`; };

  // Registro → fila de la hoja: id, nombre, fecha, entrada, sale almuerzo, regresa, (sin almuerzo: ya no aplica), salida, nota, excluido
  const toRow = (r) => [r.id, r.name, r.date, hms(r.checkIn), r.lunchOut ? hms(r.lunchOut) : "", r.lunchIn ? hms(r.lunchIn) : "", false, r.checkOut ? hms(r.checkOut) : "", r.note || "", !!r.excluded];

  // Fila de la hoja → registro (las horas son de Colombia; si una hora es menor que la anterior, es del día siguiente)
  function fromRow(row) {
    const [id, name, date, tin, lo, li, , tout, note, excl] = row.map((x) => (x == null ? "" : x));
    if (!id || !name || !/^\d{4}-\d{2}-\d{2}$/.test(String(date)) || !/^\d{1,2}:\d{2}(:\d{2})?$/.test(String(tin))) return null;
    let prev = -Infinity;
    const at = (t) => {
      if (!t) return null;
      const tt = /^\d{1,2}:\d{2}$/.test(t) ? t + ":00" : t;
      let ms = Date.parse(`${date}T${tt.padStart(8, "0")}-05:00`);
      if (isNaN(ms)) return null;
      while (ms < prev) ms += 86400000;
      prev = ms; return new Date(ms).toISOString();
    };
    const checkIn = at(String(tin)), lunchOut = at(String(lo)), lunchIn = at(String(li)), checkOut = at(String(tout));
    if (!checkIn) return null;
    const rec = { id: String(id), name: String(name), date: String(date), checkIn, lunchOut, lunchIn, lunchSkipped: false, checkOut, imported: true };
    if (note) rec.note = String(note);
    if (excl === true || String(excl).toUpperCase() === "TRUE") rec.excluded = true;
    return rec;
  }
  const known = (r) => records.some((x) => x.id === r.id || (x.name === r.name && Math.abs(Date.parse(x.checkIn) - Date.parse(r.checkIn)) < 60000));

  async function call(payload) {
    const c = cfg();
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
    try {
      const res = await fetch(c.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ token: c.token }, payload)), redirect: "follow", signal: ctl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      let data; try { data = await res.json(); } catch (e) { throw new Error("La dirección no responde como se esperaba (¿se publicó el script como aplicación web para «Cualquier usuario»?)"); }
      if (!data || data.ok !== true) throw new Error(data && data.error === "token" ? "Token incorrecto" : (data && data.error) || "Respuesta inválida");
      return data;
    } catch (e) {
      throw new Error(e.name === "AbortError" ? "Tiempo de espera agotado" : e.message === "Failed to fetch" ? "Sin conexión con Google (revisa internet o que la plataforma permita conectarse a script.google.com)" : e.message);
    } finally { clearTimeout(to); }
  }
  const setState = (state, msg) => { st.state = state; st.msg = msg || ""; if (state === "ok") st.last = new Date().toISOString(); refreshBadge(); };
  function refreshBadge() { const el = document.getElementById("sync-status"); if (el) el.innerHTML = describe(); }
  function describe() {
    if (!enabled()) return `<span class="dot off"></span>Sin configurar`;
    const t = st.last ? ` · última vez ${E.fmtClock(Date.parse(st.last))}` : "";
    if (st.state === "syncing") return `<span class="dot wait"></span>Sincronizando…`;
    if (st.state === "ok") return `<span class="dot ok"></span>Sincronizado${t}`;
    if (st.state === "error") return `<span class="dot err"></span>No se pudo sincronizar: ${esc(st.msg)}`;
    return `<span class="dot wait"></span>Listo para sincronizar`;
  }

  async function push() {
    if (!enabled()) return false;
    if (busy) { again = true; return false; }
    busy = true; setState("syncing");
    try {
      const data = await call({ action: "upsert", rows: records.map(toRow), config: { standardWeeklyHours: settings.standardWeeklyHours, lunchMin: settings.lunchMin, lunchMax: settings.lunchMax, lunchRequiredHours: settings.lunchRequiredHours } });
      failStreak = 0; setState("ok"); return data;
    } catch (e) {
      setState("error", e.message); if (failStreak++ === 0) toast("Google Sheets no se actualizó: " + e.message + ". Los datos están guardados en la plataforma.");
      return false;
    } finally { busy = false; if (again) { again = false; schedulePush(); } }
  }
  async function pull() {
    if (!enabled()) return { added: 0 };
    setState("syncing");
    try {
      const data = await call({ action: "list" });
      let added = 0;
      (data.rows || []).forEach((row) => { const r = fromRow(row); if (r && !known(r)) { records.push(r); added++; } });
      if (added) await saveRecords();
      failStreak = 0; setState("ok"); return { added, total: (data.rows || []).length };
    } catch (e) { setState("error", e.message); throw e; }
  }
  function schedulePush() { if (!enabled() || !cfg().auto) return; clearTimeout(timer); timer = setTimeout(push, 4000); }
  async function test() { setState("syncing"); try { const d = await call({ action: "ping" }); setState("ok"); return d; } catch (e) { setState("error", e.message); throw e; } }
  window.addEventListener("online", () => { if (enabled() && st.state === "error") schedulePush(); });

  // Respaldo sin red: CSV con el mismo orden de columnas de la hoja «Registros»
  function csv() {
    const q = (v) => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    return records.slice().sort((a, b) => (a.checkIn < b.checkIn ? -1 : 1)).map((r) => toRow(r).map((v) => q(v === true ? "TRUE" : v === false ? "FALSE" : v)).join(",")).join("\n") + "\n";
  }
  return { enabled, push, pull, test, schedulePush, describe, csv, toRow, fromRow, cfg, URL_RE, state: st };
})();

</script>
<script>
/* ============================================================
   PLATAFORMA — Control de horas y pago quincenal (Mystic Multimarca)
   ============================================================ */
const E = MysticEngine, X = MysticXlsx;
const EMPLOYEES = ["Alba López", "Eugenio González", "Yeremy Mendoza", "Luis Piedrahita", "Daniel Suárez", "Andrea Pardo", "Lina Acosta"];
const RECORDS_KEY = "mystic-attendance-records-v2";
const SETTINGS_KEY = "mystic-attendance-settings-v2";
const PAYROLL_KEY = "mystic-payroll-v1";
const DEFAULT_SETTINGS = { standardWeeklyHours: 42, lunchMin: 30, lunchMax: 60, lunchRequiredHours: 6, adminPin: "2026", crossing: "fromStart", sheetUrl: "", sheetToken: "", sheetAuto: true };

let records = [];
let settings = Object.assign({}, DEFAULT_SETTINGS);
let payroll = { salaries: {}, absences: [] };
let isAdmin = false;
const ui = { tab: "quincena", period: null, openEmp: null, alertFilter: "all", alertsAll: false, rec: { name: "TODOS", from: "", to: "" } };

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const pad = (n) => String(n).padStart(2, "0");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => E.colDs(Date.now());
const initials = (n) => n.split(" ").map((p) => p[0]).slice(0, 2).join("").toUpperCase();
const fmtTime = (iso) => (iso ? E.fmtClock(Date.parse(iso)) : "—");
const money = (n) => E.fmtCOP(n);
const hm = (ms) => { if (!ms || ms < 500) return "—"; const m = Math.round(ms / 60000); return `${Math.floor(m / 60)}:${pad(m % 60)}`; };
const hhmm = (iso) => { const d = new Date(Date.parse(iso) + E.COL); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const toIso = (d, t) => new Date(Date.parse(`${d}T${t}:00-05:00`)).toISOString();
const fmtDay = (ds, opts) => new Date(E.utcOf(ds)).toLocaleDateString("es-CO", Object.assign({ weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }, opts || {}));
const fmtDayShort = (ds) => new Date(E.utcOf(ds)).toLocaleDateString("es-CO", { day: "numeric", month: "short", timeZone: "UTC" });
const ICO = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', coin: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', alert: '<path d="M12 4l9 16H3zM12 10v4M12 17.5v.5"/>', down: '<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>'
};
const ico = (k) => `<svg class="i" viewBox="0 0 24 24">${ICO[k]}</svg>`;
const parseMoney = (s) => Number(String(s).replace(/\D/g, "")) || 0;
const newId = () => Date.now() + "-" + Math.random().toString(36).slice(2, 7);
const monthName = (y, m) => new Date(Date.UTC(y, m - 1, 1)).toLocaleDateString("es-CO", { month: "long", timeZone: "UTC" });

/* ---------- Almacenamiento (con respaldo local si no hay almacenamiento compartido) ---------- */
const store = {
  async get(k) {
    if (window.storage) { try { const r = await window.storage.get(k, true); return r ? JSON.parse(r.value) : null; } catch (e) { return null; } }
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  },
  async set(k, v) {
    const s = JSON.stringify(v);
    if (window.storage) { try { await window.storage.set(k, s, true); return true; } catch (e) { return false; } }
    try { localStorage.setItem(k, s); return true; } catch (e) { return false; }
  }
};
async function loadData() {
  records = (await store.get(RECORDS_KEY)) || [];
  settings = Object.assign({}, DEFAULT_SETTINGS, (await store.get(SETTINGS_KEY)) || {});
  const p = (await store.get(PAYROLL_KEY)) || {};
  payroll = { salaries: p.salaries || {}, absences: p.absences || [], seedVersion: p.seedVersion || null };
  await applySeed();
}
// Importación única: registros de la hoja (sin duplicar) y salario mínimo legal 2026 como base de quien no tenga salario.
const seedIso = (d, t) => new Date(Date.parse(`${d}T${t}-05:00`)).toISOString();
async function applySeed() {
  if (typeof SEED === "undefined" || payroll.seedVersion === SEED.version) return;
  let added = 0;
  SEED.rows.forEach(([id, name, date, tin, lo, li, tout]) => {
    const ci = seedIso(date, tin);
    if (records.some((r) => r.id === id || (r.name === name && Math.abs(Date.parse(r.checkIn) - Date.parse(ci)) < 60000))) return;
    records.push({ id, name, date, checkIn: ci, lunchOut: lo ? seedIso(date, lo) : null, lunchIn: li ? seedIso(date, li) : null, lunchSkipped: false, checkOut: tout ? seedIso(date, tout) : null, imported: true });
    added++;
  });
  EMPLOYEES.forEach((n) => { if (!payroll.salaries[n]) payroll.salaries[n] = SEED.smmlv; });
  payroll.seedVersion = SEED.version;
  if (added) await saveRecords();
  await savePayroll();
}
// Guardado seguro entre dispositivos: antes de escribir se leen los registros guardados y se agregan los que otro
// dispositivo haya creado (para no pisarlos). `replace` se usa solo al eliminar. Los datos locales ganan por id.
let saving = 0;
const saveRecords = async (opts) => {
  saving++;
  try {
    if (!(opts && opts.replace)) {
      const remote = await store.get(RECORDS_KEY);
      if (Array.isArray(remote)) { const mine = new Set(records.map((r) => r.id)); remote.forEach((r) => { if (r && !mine.has(r.id)) records.push(r); }); }
    }
    if (!(await store.set(RECORDS_KEY, records))) toast("No se pudo guardar. Intenta de nuevo."); else Sync.schedulePush();
  } finally { saving--; }
};
async function refreshRecords() { if (saving) return; const remote = await store.get(RECORDS_KEY); if (Array.isArray(remote) && !saving) records = remote; }
const saveSettings = async () => { if (!(await store.set(SETTINGS_KEY, settings))) toast("No se pudo guardar la configuración."); };
const savePayroll = async () => { if (!(await store.set(PAYROLL_KEY, payroll))) toast("No se pudo guardar los salarios."); };

/* ---------- Avisos y ventanas ---------- */
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
function closeModal() {
  const m = $("#modal"); if (!m) return;
  m.id = "modal-closing"; m.classList.remove("show"); setTimeout(() => m.remove(), 260);
}
function openModal(html, onMount) {
  closeModal();
  const o = document.createElement("div"); o.id = "modal"; o.className = "overlay";
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(o);
  requestAnimationFrame(() => o.classList.add("show"));
  o.addEventListener("click", (e) => { if (e.target === o) closeModal(); });
  if (onMount) onMount(o);
  return o;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
function confirmModal(title, text, okLabel, onOk, tone) {
  openModal(`<h3>${esc(title)}</h3><p>${text}</p>
    <div class="actions"><button class="btn btn-soft" data-x="cancel">Cancelar</button><button class="btn ${tone || "btn-out"}" data-x="ok">${esc(okLabel || "Confirmar")}</button></div>`, (o) => {
    o.querySelector('[data-x="cancel"]').onclick = closeModal;
    o.querySelector('[data-x="ok"]').onclick = () => { closeModal(); onOk(); };
  });
}
function pinModal(onSubmit) {
  openModal(`<h3>Vista de administración</h3><p>Ingresa el PIN para ver horas, salarios y pagos.</p>
    <input type="password" class="pin" id="pin-in" inputmode="numeric" autocomplete="off" placeholder="••••" aria-label="PIN" style="margin-bottom:16px">
    <div class="actions"><button class="btn btn-soft" data-x="cancel">Cancelar</button><button class="btn btn-in" data-x="ok">Entrar</button></div>`, (o) => {
    const i = o.querySelector("#pin-in"); setTimeout(() => i.focus(), 60);
    const go = () => { const v = i.value; closeModal(); onSubmit(v); };
    o.querySelector('[data-x="ok"]').onclick = go; o.querySelector('[data-x="cancel"]').onclick = closeModal;
    i.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  });
}

/* ---------- Registro de asistencia ---------- */
const getOpen = (n) => records.find((r) => r.name === n && r.date === today() && !r.checkOut);
const getClosedToday = (n) => records.filter((r) => r.name === n && r.date === today() && r.checkOut);
const first = (n) => n.split(" ")[0];

async function markCheckIn(name) {
  if (getOpen(name)) { toast(`${first(name)} ya tiene una entrada activa hoy.`); return; }
  records.push({ id: newId(), name, date: today(), checkIn: new Date().toISOString(), lunchOut: null, lunchIn: null, checkOut: null });
  await saveRecords(); toast(`Entrada registrada para ${first(name)}`); render();
}
async function markLunchOut(name) { const o = getOpen(name); if (!o) return; o.lunchOut = new Date().toISOString(); await saveRecords(); toast("Salida a almuerzo registrada"); render(); }
async function markLunchIn(name) {
  const o = getOpen(name); if (!o || !o.lunchOut) return;
  const earliest = Date.parse(o.lunchOut) + settings.lunchMin * 60000;
  if (Date.now() < earliest) { toast(`El almuerzo dura mínimo ${settings.lunchMin} min. Podrás marcar el regreso a las ${E.fmtClock(earliest)}.`); return; }
  o.lunchIn = new Date().toISOString(); await saveRecords();
  const lm = Math.round((Date.parse(o.lunchIn) - Date.parse(o.lunchOut)) / 60000);
  toast(lm > settings.lunchMax ? `Regreso registrado. Tu almuerzo duró ${lm} min y el máximo es ${settings.lunchMax}.` : "Regreso de almuerzo registrado"); render();
}
async function markCheckOut(name) {
  const o = getOpen(name); if (!o) return;
  if (!o.lunchOut && (Date.now() - Date.parse(o.checkIn)) / 3600000 > settings.lunchRequiredHours) { toast(`Antes de salir registra tu almuerzo (obligatorio: entre ${settings.lunchMin} y ${settings.lunchMax} min).`); return; }
  o.checkOut = new Date().toISOString(); await saveRecords(); toast(`Salida registrada para ${first(name)}`); render(); }

function card(name) {
  const open = getOpen(name), last = getClosedToday(name).slice(-1)[0];
  let cls = "", av = "", pulse = "", status = "", actions = "", note = "";
  const b = (act, label, tone) => `<button class="btn ${tone}" data-act="${act}" data-name="${esc(name)}">${label}</button>`;
  if (open && open.lunchOut && !open.lunchIn) {
    cls = "on-lunch"; av = "lunch"; pulse = "gold";
    const lo = Date.parse(open.lunchOut), earliest = lo + settings.lunchMin * 60000, latest = lo + settings.lunchMax * 60000;
    status = `<div class="status lunch">En almuerzo desde ${fmtTime(open.lunchOut)}</div>`;
    if (Date.now() < earliest) {
      actions = `<button class="btn btn-lunch" disabled>Regreso desde las ${E.fmtClock(earliest)}</button>`;
      note = `<div class="note info">Almuerzo mínimo de ${settings.lunchMin} min. Máximo: hasta las ${E.fmtClock(latest)}</div>`;
    } else {
      actions = b("lunchIn", "Regreso de almuerzo", "btn-lunch");
      note = `<div class="note ${Date.now() > latest ? "warn" : "info"}">${Date.now() > latest ? `Ya pasaron los ${settings.lunchMax} min de almuerzo: regresa y marca tu regreso.` : `Regresa antes de las ${E.fmtClock(latest)} (máximo ${settings.lunchMax} min).`}</div>`;
    }
  } else if (open) {
    cls = "active"; status = `<div class="status live">● Activa desde ${fmtTime(open.checkIn)}</div>`;
    if (!open.lunchOut) {
      actions = b("lunchOut", "Salida a almuerzo", "btn-lunch") + b("out", "Marcar salida", "btn-soft");
      note = `<div class="note">El almuerzo es obligatorio: entre ${settings.lunchMin} y ${settings.lunchMax} min.</div>`;
    } else {
      actions = b("out", "Marcar salida", "btn-out");
      if (open.lunchOut && open.lunchIn) {
        const lm = (Date.parse(open.lunchIn) - Date.parse(open.lunchOut)) / 60000;
        if (lm > settings.lunchMax + 2) note = `<div class="note warn">Almuerzo de ${Math.round(lm)} min: superó el máximo de ${settings.lunchMax} min. Queda por revisar.</div>`;
      }
    }
  } else if (last) {
    status = `<div class="status">Jornada cerrada a las ${fmtTime(last.checkOut)}</div>`;
    actions = b("in", "Marcar nueva entrada", "btn-in"); note = `<div class="note">Jornada de hoy completada ✓</div>`;
  } else {
    status = `<div class="status">Sin registrar hoy</div>`; actions = b("in", "Marcar entrada", "btn-in");
  }
  return `<div class="card ${cls}"><div class="card-top"><div class="avatar-ring">${open ? `<div class="pulse ${pulse}"></div>` : ""}<div class="avatar ${av}">${initials(name)}</div></div>
    <div><div class="name">${esc(name)}</div>${status}</div></div>${actions}${note}</div>`;
}

/* ---------- Cálculo ---------- */
function calc() {
  return E.computePeriod({
    records, employees: EMPLOYEES, salaries: payroll.salaries, absences: payroll.absences,
    from: ui.period.from, to: ui.period.to, weeklyHours: settings.standardWeeklyHours,
    crossing: settings.crossing, lunchMin: settings.lunchMin, lunchMax: settings.lunchMax, lunchRequiredHours: settings.lunchRequiredHours, today: today()
  });
}
const periodTitle = (p) => `${p.half === 1 ? "1.ª" : "2.ª"} quincena de ${monthName(p.year, p.month)} ${p.year}`;

/* ---------- Vista: equipo ---------- */
function viewTeam() {
  const h = new Date().toLocaleTimeString("es-CO", { hour: "numeric", hour12: false, timeZone: "America/Bogota" });
  const greet = +h < 12 ? "Buenos días" : +h < 19 ? "Buenas tardes" : "Buenas noches";
  return `<section class="view"><h2 class="title">${greet}, equipo</h2>
    <p class="lede">Marca tu entrada, tu almuerzo y tu salida. El almuerzo es obligatorio: mínimo ${settings.lunchMin} y máximo ${settings.lunchMax} minutos.</p>
    <div class="grid">${EMPLOYEES.map(card).join("")}</div>
    <p class="foot">Los resúmenes de horas, recargos y pagos los administra la coordinación del equipo.</p></section>`;
}

/* ---------- Vista: quincena ---------- */
function periodBar(res) {
  const p = ui.period, live = p.to >= today();
  return `<div class="period">
    <button class="nav-btn" data-act="period-prev" aria-label="Quincena anterior">‹</button>
    <div class="period-label"><b>${periodTitle(p)} <span class="badge ${live ? "live" : "closed"}">${live ? "En curso" : "Cerrada"}</span></b>

function smoothPath(pts, base) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const y1 = Math.min(base, p1[1] + (p2[1] - p0[1]) / 6), y2 = Math.min(base, p2[1] - (p3[1] - p1[1]) / 6);
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${y1.toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${y2.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
const SERIES = [["Trabajadas", "var(--blue)"], ["Extra diurna", "var(--orange)"], ["Extra nocturna", "var(--cyan)"]];
function chartPanel(res) {

  const rows = dates.map((d) => (by[d] || [0, 0, 0]).map((ms) => Math.round((ms / E.MS_H) * 100) / 100));
  const mx = Math.max(10, ...rows.map((r) => Math.max(...r))), step = [5, 10, 20, 25, 50, 100, 200, 250, 500].find((s) => mx / s <= 5) || 500, top = Math.ceil(mx / step) * step;
  const W = 720, H = 280, L = 44, Rr = 16, Tp = 16, B = 32, base = H - B, dx = (W - L - Rr) / Math.max(1, dates.length - 1);
  const X = (i) => L + i * dx, Y = (v) => Tp + (1 - v / top) * (base - Tp);
  let grid = ""; for (let v = 0; v <= top; v += step) grid += `<line class="grid-l" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 10}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;

    <div class="chart" data-chart="${data}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas por día: trabajadas, extra diurna y extra nocturna">${grid}${labels}<line class="guide" x1="${L}" x2="${L}" y1="${Tp}" y2="${base}"/>${lines}${dots}</svg><div class="tip"></div></div>

function recordModal(rec) {
  const r = rec || { name: EMPLOYEES[0], date: today(), checkIn: null, checkOut: null, lunchOut: null, lunchIn: null, note: "" };
  openModal(`<h3>${rec ? "Editar registro" : "Registro manual"}</h3><p>Horas en hora de Colombia. Útil para corregir olvidos o cargar jornadas.</p>
    <div class="grid2">
      <label class="field full"><span>Empleado</span><select id="m-name">${EMPLOYEES.map((n) => `<option ${r.name === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
      <label class="field full"><span>Fecha</span><input type="date" id="m-date" value="${r.date}"></label>
      <label class="field"><span>Entrada</span><input type="time" id="m-in" value="${r.checkIn ? hhmm(r.checkIn) : "08:00"}"></label>
      <label class="field"><span>Salida</span><input type="time" id="m-out" value="${r.checkOut ? hhmm(r.checkOut) : ""}"></label>
      <label class="field"><span>Salida a almuerzo</span><input type="time" id="m-lo" value="${r.lunchOut ? hhmm(r.lunchOut) : ""}"></label>
      <label class="field"><span>Regreso de almuerzo</span><input type="time" id="m-li" value="${r.lunchIn ? hhmm(r.lunchIn) : ""}"></label>
      <label class="field full"><span>Nota (opcional)</span><input type="text" id="m-note" value="${esc(r.note || "")}" placeholder="Ej.: carga manual desde captura"></label></div>
    <div class="actions"><button class="btn btn-soft" data-x="cancel">Cancelar</button><button class="btn btn-in" data-x="ok">Guardar</button></div>`, (o) => {
    o.querySelector('[data-x="cancel"]').onclick = closeModal;
    o.querySelector('[data-x="ok"]').onclick = async () => {
      const v = (id) => o.querySelector(id).value, date = v("#m-date"), tin = v("#m-in"), tout = v("#m-out"), lo = v("#m-lo"), li = v("#m-li");
      if (!date || !tin) { toast("Falta la fecha o la hora de entrada."); return; }
      if (tout && tout <= tin) { toast("La salida debe ser posterior a la entrada."); return; }
      if ((lo && !li) || (!lo && li)) { toast("Completa salida y regreso de almuerzo, o deja ambos vacíos."); return; }
      if (lo && li && (lo < tin || (tout && li > tout) || li <= lo)) { toast("Las horas de almuerzo no cuadran con la jornada."); return; }
      const data = { name: v("#m-name"), date, checkIn: toIso(date, tin), checkOut: tout ? toIso(date, tout) : null,
        lunchOut: lo ? toIso(date, lo) : null, lunchIn: li ? toIso(date, li) : null, lunchSkipped: false, note: v("#m-note").trim() };
      if (rec) Object.assign(rec, data); else records.push(Object.assign({ id: newId(), manual: true }, data));
      await saveRecords(); closeModal();
      const lunchWarn = lo && li ? (() => { const m = (Date.parse(data.lunchIn) - Date.parse(data.lunchOut)) / 60000; return m < settings.lunchMin - 2 || m > settings.lunchMax + 2 ? `almuerzo de ${Math.round(m)} min fuera del rango ${settings.lunchMin}–${settings.lunchMax}` : ""; })()
        : (data.checkOut && (Date.parse(data.checkOut) - Date.parse(data.checkIn)) / 3600000 > settings.lunchRequiredHours ? "sin almuerzo (obligatorio)" : "");
      toast(lunchWarn ? `Registro guardado con aviso: ${lunchWarn}.` : "Registro guardado"); render();
    };
  });
}
function excludeRecord(id) {
  const r = records.find((x) => x.id === id); if (!r) return;
  if (r.excluded) { r.excluded = false; saveRecords(); toast("Registro incluido de nuevo"); render(); return; }
  openModal(`<h3>Excluir del cálculo</h3><p>El registro se conserva pero no suma horas. Deja una nota para recordar el motivo.</p>
    <label class="field" style="margin-bottom:16px"><span>Motivo</span><input type="text" id="x-note" placeholder="Ej.: duplicado, prueba, carga errónea" value="${esc(r.note || "")}"></label>
    <div class="actions"><button class="btn btn-soft" data-x="cancel">Cancelar</button><button class="btn btn-out" data-x="ok">Excluir</button></div>`, (o) => {
    setTimeout(() => o.querySelector("#x-note").focus(), 60);
    o.querySelector('[data-x="cancel"]').onclick = closeModal;
    o.querySelector('[data-x="ok"]').onclick = async () => { r.excluded = true; r.note = o.querySelector("#x-note").value.trim(); await saveRecords(); closeModal(); render(); };
  });
}

/* ---------- Excel ---------- */
function download(name, bytes, mime) {
  const url = URL.createObjectURL(new Blob([bytes], { type: mime })); const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
}
function exportExcel() {
  const res = calc(), p = ui.period, n = res.employees.length, dec = (ms) => Math.round((ms / E.MS_H) * 10000) / 10000;
  const hdr = (arr) => arr.map((v) => ({ v, s: "header" }));
  const crossTxt = res.crossing === "fromStart" ? "semanas que cruzan: se cuenta desde el inicio de la quincena" : "semanas que cruzan: se cuenta la semana completa";
  // 1. Resumen
  const R1 = [[{ v: `Reporte de horas extra — ${periodTitle(p)}`, s: "title" }],
    [`Mystic Multimarca · ${fmtDayShort(p.from)} al ${fmtDayShort(p.to)} · jornada ${res.weeklyHours} h/sem · valor hora = salario ÷ ${res.divisor} · ${crossTxt}`], [],
    hdr(["Empleado", "Salario base", "Valor hora", "Horas trabajadas", "Extra diurna (h)", "Extra nocturna (h)", "Nocturna ordinaria (h)", "Dom./festivo (h)", "Salario quincenal", "Descuento ausencias", "Recargo nocturno ordinario", "Recargo dominical/festivo", "Extras diurnas", "Extras nocturnas", "Recargo dominical s/ extras", "Total extras y recargos", "Total estimado"])];
  res.employees.forEach((e, i) => { const r = 5 + i;
    R1.push([{ v: e.name, s: "bold" }, { v: e.salary, s: "money" }, { v: Math.round(e.valorHora), s: "money" }, { v: dec(e.hours.workedMs), s: "hours" },
      { v: dec(e.hours.extraDayMs), s: e.hours.extraDayMs > 500 ? "hoursGold" : "hours" }, { v: dec(e.hours.extraNightMs), s: e.hours.extraNightMs > 500 ? "hoursGold" : "hours" },
      { v: dec(e.hours.ordNightMs), s: e.hours.ordNightMs > 1000 ? "hoursWarn" : "hours" }, { v: dec(e.hours.holidayMs), s: "hours" },
      { v: e.pay.base, s: "money" }, { v: -e.pay.deduction, s: "money" }, { v: e.pay.ordNight, s: "money" }, { v: e.pay.ordHoliday, s: "money" }, { v: e.pay.extDay, s: "money" }, { v: e.pay.extNight, s: "money" }, { v: e.pay.extHoliday, s: "money" },
      { v: e.pay.extrasTotal, f: `SUM(K${r}:O${r})`, s: "money" }, { v: e.pay.total, f: `I${r}+J${r}+P${r}`, s: "moneyBold" }]); });
  const tr = 5 + n, col = (c) => X.colName(c), sumv = (fn) => res.employees.reduce((s, e) => s + fn(e), 0);
  const totals = [{ v: "Equipo", s: "soft" }, { v: "", s: "soft" }, { v: "", s: "soft" }];
  [[3, (e) => dec(e.hours.workedMs), "hours"], [4, (e) => dec(e.hours.extraDayMs), "hours"], [5, (e) => dec(e.hours.extraNightMs), "hours"], [6, (e) => dec(e.hours.ordNightMs), "hours"], [7, (e) => dec(e.hours.holidayMs), "hours"],
    [8, (e) => e.pay.base, "moneyBold"], [9, (e) => -e.pay.deduction, "moneyBold"], [10, (e) => e.pay.ordNight, "moneyBold"], [11, (e) => e.pay.ordHoliday, "moneyBold"], [12, (e) => e.pay.extDay, "moneyBold"], [13, (e) => e.pay.extNight, "moneyBold"],
    [14, (e) => e.pay.extHoliday, "moneyBold"], [15, (e) => e.pay.extrasTotal, "moneyBold"], [16, (e) => e.pay.total, "moneyBold"]].forEach(([c, fn, s]) => totals.push({ v: sumv(fn), f: `SUM(${col(c)}5:${col(c)}${tr - 1})`, s }));
  R1.push(totals);
  // 2. Detalle diario
  const R2 = [hdr(["Empleado", "Fecha", "Día", "Entrada", "Almuerzo", "Salida", "Horas trabajadas", "Extra diurna (h)", "Extra nocturna (h)", "Nocturna ordinaria (h)", "Observación"])];
  res.employees.forEach((e) => e.days.forEach((d) => {
    const rs = d.records, bad = d.notes.some((x) => /incoherente|sin salida|duplicado|excluido/.test(x)), gold = d.extraDayMs + d.extraNightMs > 500;
    const base = bad ? "warn" : "normal";
    R2.push([{ v: e.name, s: bad ? "warn" : "bold" }, { v: d.date, s: base }, { v: fmtDay(d.date, { weekday: "long", day: undefined, month: undefined }), s: base },
      { v: rs.map((r) => fmtTime(r.checkIn)).join(" / "), s: base }, { v: rs.map((r) => (r.lunchOut && r.lunchIn ? `${fmtTime(r.lunchOut)}–${fmtTime(r.lunchIn)}` : "—")).join(" / "), s: base },
      { v: rs.map((r) => (r.checkOut ? fmtTime(r.checkOut) : "—")).join(" / "), s: base }, { v: dec(d.workedMs), s: "hours" },
      { v: dec(d.extraDayMs), s: gold && d.extraDayMs > 500 ? "hoursGold" : "hours" }, { v: dec(d.extraNightMs), s: gold && d.extraNightMs > 500 ? "hoursGold" : "hours" },
      { v: dec(d.ordNightMs), s: d.ordNightMs > 1000 ? "hoursWarn" : "hours" }, { v: d.notes.join(" · "), s: base }]);
  }));
  // 3. Semanas
  const R3 = [hdr(["Empleado", "Semana (lun–dom)", "Trabajadas en la quincena (h)", "Acreditadas por ausencia (h)", "Total para conteo semanal (h)", "Horas extra (h)", "Extra nocturna (h)", "Extra diurna (h)", "Nocturna ordinaria (h)", "Nota"])];
  res.employees.forEach((e) => e.weeks.forEach((w) => R3.push([{ v: e.name, s: "bold" }, `${fmtDayShort(w.weekStart)} – ${fmtDayShort(w.weekEnd)}`, { v: dec(w.workedMs), s: "hours" }, { v: dec(w.creditMs), s: "hours" },
    { v: dec(w.workedMs + w.creditMs), s: "hours" }, { v: dec(w.extraMs), s: w.extraMs > 500 ? "hoursGold" : "hours" }, { v: dec(w.extraNightMs), s: "hours" }, { v: dec(w.extraDayMs), s: "hours" },
    { v: dec(w.ordNightMs), s: w.ordNightMs > 1000 ? "hoursWarn" : "hours" }, w.partial ? "Semana parcial dentro del periodo" : ""])));
  // 4. Notas
  const dom = Math.round(E.sundayPct(p.to) * 100);
  const R4 = [[{ v: "Notas del periodo", s: "title" }], [],
    [{ v: "Reglas aplicadas", s: "bold" }],
    [`Jornada semanal estándar: ${res.weeklyHours} h (lunes a domingo). Valor hora = salario ÷ ${res.divisor}.`],
    ["Recargo nocturno: 7:00 p. m. a 6:00 a. m. (+35 %). Extra diurna +25 %. Extra nocturna +75 %."],
    [`Dominical/festivo: +${dom} %. Los recargos se suman entre sí. Las horas extra se pagan completas (hora + recargo); las ordinarias nocturnas o dominicales solo pagan el recargo.`],
    ["Las horas extra de la semana se asignan primero a las trabajadas en horario nocturno (7 p. m. en adelante); el resto es extra diurna hacia el final de la semana."],
    ["Ausencias: se descuenta el día (salario ÷ 30) y se acreditan horas solo para el conteo semanal."], [crossTxt.charAt(0).toUpperCase() + crossTxt.slice(1) + "."], [],
    [{ v: "Observaciones y datos por revisar", s: "bold" }]];
  if (!res.alerts.length) R4.push(["Sin observaciones."]);
  res.alerts.forEach((a) => R4.push([{ v: `${{ error: "ERROR", warn: "AVISO", info: "Nota" }[a.level]} · ${a.name}${a.date ? " · " + fmtDayShort(a.date) : ""}: ${a.text}`, s: a.level === "info" ? "normal" : "warn" }]));
  R4.push([], [{ v: "El total estimado no incluye auxilio de transporte, aportes ni prestaciones. La liquidación exacta se valida con el contador o asesor laboral.", s: "wrap" }]);
  const bytes = X.build([
    { name: "Resumen quincena", cols: [22, 14, 12, 12, 12, 12, 14, 12, 15, 15, 16, 16, 14, 14, 16, 17, 16], rows: R1, freeze: 4, rowHeights: { 3: 44 } },
    { name: "Detalle diario", cols: [22, 12, 12, 13, 22, 13, 12, 12, 12, 14, 60], rows: R2, freeze: 1, rowHeights: { 0: 32 } },
    { name: "Resumen semanal", cols: [22, 20, 16, 16, 16, 13, 13, 13, 14, 30], rows: R3, freeze: 1, rowHeights: { 0: 44 } },
    { name: "Notas del periodo", cols: [140], rows: R4 }
  ]);
  download(`Reporte-horas-extra_${p.from}_a_${p.to}.xlsx`, bytes, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  toast("Excel descargado");
}
