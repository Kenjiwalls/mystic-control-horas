  "sheet-push": async () => { if (!Sync.enabled()) return toast("Primero escribe la dirección y el token."); const ok = await Sync.push(); if (ok) toast(`Hoja actualizada (${ok.updated || 0} cambios, ${ok.added || 0} nuevos)`); },
  "sheet-pull": async () => { if (!Sync.enabled()) return toast("Primero escribe la dirección y el token."); try { const r = await Sync.pull(); toast(r.added ? `${r.added} registro(s) traídos de la hoja` : "La plataforma ya tiene todo lo de la hoja"); render(); } catch (e) { toast("No se pudo leer la hoja: " + e.message); } },
  "sheet-csv": () => { download(`mystic-registros-${today()}.csv`, "\ufeff" + Sync.csv(), "text/csv;charset=utf-8"); toast("CSV descargado (mismo orden de columnas de la hoja)"); },
  backup: () => { download(`mystic-respaldo-${today()}.json`, JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), records, settings, payroll }, null, 1), "application/json"); toast("Copia descargada"); },
  restore: () => $("#restore-file").click()
};
const changes = {
  salary: async (t) => { const v = parseMoney(t.value); if (v) payroll.salaries[t.dataset.name] = v; else delete payroll.salaries[t.dataset.name]; await savePayroll(); toast("Salario guardado"); render(); },
  weekly: async (t) => { const v = parseFloat(t.value); settings.standardWeeklyHours = v > 0 ? v : 42; await saveSettings(); render(); },
  lunchMin: async (t) => { const v = parseFloat(t.value); settings.lunchMin = v >= 0 ? Math.min(v, settings.lunchMax) : 30; await saveSettings(); render(); },
  lunchMax: async (t) => { const v = parseFloat(t.value); settings.lunchMax = v > 0 ? Math.max(v, settings.lunchMin) : 60; await saveSettings(); render(); },
  sheetUrl: async (t) => { settings.sheetUrl = t.value.trim(); await saveSettings(); if (settings.sheetUrl && !Sync.URL_RE.test(settings.sheetUrl)) toast("La dirección debe verse como https://script.google.com/macros/s/…/exec"); render(); },
  sheetToken: async (t) => { settings.sheetToken = t.value.trim(); await saveSettings(); render(); },
  sheetAuto: async (t) => { settings.sheetAuto = t.value === "1"; await saveSettings(); render(); },
  lunchReq: async (t) => { const v = parseFloat(t.value); settings.lunchRequiredHours = v > 0 ? v : 6; await saveSettings(); render(); },
  crossing: async (t) => { settings.crossing = t.value; await saveSettings(); render(); },
  pin: async (t) => { settings.adminPin = t.value.trim() || "2026"; await saveSettings(); toast("PIN actualizado"); render(); },
  "rec-name": (t) => { ui.rec.name = t.value; render(); }, "rec-from": (t) => { ui.rec.from = t.value; render(); }, "rec-to": (t) => { ui.rec.to = t.value; render(); }
};
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const f = actions[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".emp-row")) { e.preventDefault(); actions["toggle-emp"](e.target); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "restore-file" && t.files[0]) {
    const file = t.files[0], fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result); if (!Array.isArray(d.records)) throw new Error("formato");
        confirmModal("Restaurar copia", `Se reemplazarán los datos actuales por los del archivo (${d.records.length} registros).`, "Restaurar", async () => {
          records = d.records; settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {}); payroll = { salaries: (d.payroll || {}).salaries || {}, absences: (d.payroll || {}).absences || [], seedVersion: (d.payroll || {}).seedVersion || null };
          await saveRecords(); await saveSettings(); await savePayroll(); toast("Copia restaurada"); render();
        }, "btn-in");
      } catch (err) { toast("El archivo no es una copia válida."); }
    };
    fr.readAsText(file); t.value = ""; return;
  }
  const f = t.dataset && t.dataset.chg && changes[t.dataset.chg]; if (f) f(t);
});

/* ---------- Gráfica interactiva ---------- */
function chartTip(c, clientX) {
  const d = JSON.parse(c.dataset.chart), svg = c.querySelector("svg"), rect = svg.getBoundingClientRect();
  const xr = ((clientX - rect.left) / rect.width) * d.W, i = Math.max(0, Math.min(d.d.length - 1, Math.round((xr - d.L) / d.dx))), x = d.L + i * d.dx;
  c.classList.add("on");
  const g = c.querySelector(".guide"); g.setAttribute("x1", x); g.setAttribute("x2", x);
  c.querySelectorAll(".dot-p").forEach((p) => { const v = d.r[i][+p.dataset.k]; p.setAttribute("cx", x); p.setAttribute("cy", d.Tp + (1 - v / d.top) * (d.base - d.Tp)); });
  const tip = c.querySelector(".tip"), pxL = (x / d.W) * rect.width + (rect.left - c.getBoundingClientRect().left);
  tip.style.left = Math.max(70, Math.min(c.clientWidth - 70, pxL)) + "px";
  tip.innerHTML = `<small>${fmtDay(d.d[i])}</small>` + d.n.map((n, k) => `${n}: ${hm(d.r[i][k] * E.MS_H)}`).join("<br>");
}
document.addEventListener("pointermove", (e) => {
  const c = e.target.closest && e.target.closest(".chart");
  document.querySelectorAll(".chart.on").forEach((x) => { if (x !== c) x.classList.remove("on"); });
  if (c) chartTip(c, e.clientX);
});
document.addEventListener("pointerdown", (e) => { const c = e.target.closest && e.target.closest(".chart"); if (c) chartTip(c, e.clientX); });

/* ---------- Reloj y arranque ---------- */
function tick() {
  const n = new Date();
  $("#clock-t").textContent = n.toLocaleTimeString("es-CO", { hour12: true, timeZone: "America/Bogota" });
  $("#clock-d").textContent = n.toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long", timeZone: "America/Bogota" });
}
setInterval(tick, 1000);
setInterval(async () => { if (!isAdmin && !$("#modal")) { await refreshRecords(); if (!isAdmin && !$("#modal")) render(); } }, 60000);
window.addEventListener("resize", () => { placeThumb($("#seg-main")); if (isAdmin) placeThumb($("#seg-sub")); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placeThumb($("#seg-main")); if (isAdmin) placeThumb($("#seg-sub")); });
(async function init() {
  tick(); await loadData(); ui.period = E.periodOf(today()); render();
  if (Sync.enabled()) Sync.pull().then((r) => { if (r.added) { toast(`${r.added} registro(s) nuevo(s) traídos de la hoja`); render(); } }).catch(() => {}).finally(() => Sync.schedulePush());
})();

</script>
